
services:
  # 1. Backend Service (Flask API)
  - type: web
    name: roamiq-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: backend.app:app
    autoDeploy: true

  # 2. Frontend Service (React App via Node.js)
  - type: web
    name: roamiq-frontend
    env: node
    region: ohio
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s build -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_API_URL
        value: https://roamiq-backend.onrender.com
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
